<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poemario del tercer mesaversario</title>

<link rel="stylesheet" href="css/styles.css">
</head>

<body>

<div class="book" id="book"></div>


<div class="music-player collapsed" id="musicPlayer">

  <div class="music-toggle" id="musicToggle">

    <span class="music-icon">♫</span>

    <span id="trackTitle">
      Cargando...
    </span>

  </div>

  <div class="music-content">

    <div class="music-controls">

      <button id="prevTrack" aria-label="Canción anterior">
        ⏮
      </button>

      <button id="playBtn" aria-label="Reproducir o pausar">
        ▶
      </button>

      <button id="nextTrack" aria-label="Siguiente canción">
        ⏭
      </button>

    </div>

    <div class="progress-container">

      <span id="currentTime">
        0:00
      </span>

      <input
        type="range"
        id="progress"
        min="0"
        max="100"
        value="0">

      <span id="duration">
        0:00
      </span>

    </div>

    <div class="volume-container">

      <span>🔊</span>

      <input
        type="range"
        id="volume"
        min="0"
        max="1"
        step="0.01"
        value="0.4">

    </div>

  </div>

</div>

<audio id="bgMusic"></audio>

<div class="dots" id="dots"></div>

<script src="js/pages.js"></script>
<script src="js/main.js"></script>

</body>
</html>
